# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Proof-Carrying Decreasing-Diagram Confluence Certificates"
  description: >-
    A Lean 4.33.0 formalization of a generic soundness theorem for finite,
    proof-carrying decreasing-diagram certificates. An artifact lists the
    labeled rewrite steps and explicit decreasing valleys for every local
    peak; an executable checker validates the finite data, while a separate
    completeness proof connects that data to the semantic relation. The
    theorem then derives confluence of the unlabeled relation without assuming
    termination. The repository includes a nontrivial funnel regression with
    three local peaks and negative certificate tests, plus a generated family
    study of canonical compression.
  authors:
    - "Arthur Freitas Ramos"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["cs.LO"]
  msc2020: ["68Q42"]

sources:
  - title: "Confluence by decreasing diagrams"
    authors:
      - "Vincent van Oostrom"
    type: "paper"
    id: "https://doi.org/10.1016/0304-3975(92)00023-K"
    relationship: "formalizes"
    note: >-
      The selected theorem formalizes the symmetric strict local-decreasing
      proof pattern. The cited source receives the mathematical priority; this
      project claims the certificate language, executable checker boundary,
      completeness bridge, and Lean implementation, not a new confluence
      criterion.

related_formalizations:
  - id: "https://arxiv.org/abs/1210.1100"
    relationship: "independent"
    note: >-
      This is a prior Isabelle formalization of decreasing diagrams. The
      selected Lean package is an independent source-level reimplementation;
      it imports neither Isabelle nor the parent Metatheory modules in its
      Challenge closure.

status:
  scope: >-
    The selected declaration is
    `Metatheory.Palomar433.checked_complete_confluence` in
    `palomar/Solution.lean`. For arbitrary labeled relations, a Boolean step
    predicate and label-order predicate that reflect their semantic relations,
    a finite edge table, and explicit peak certificates, it proves that
    checker acceptance plus semantic step-table completeness implies
    confluence of the unlabeled union. The checker validates each listed edge,
    canonical certificate orientation, all same-source pairs in the finite
    table, route validity, and strict descent along both valley paths. The
    underlying relation need not terminate. `Checks.lean` instantiates the
    theorem on an eight-node, ten-rule funnel with three distinct local peaks
    and a four-step cycle; its rejected variants cover missing peaks, a bad
    valley, and reversed orientation. The parent repository also retains a
    parameterized benchmark family for compression measurements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound"]
  main_results:
    - declaration: "Metatheory.Palomar433.checked_complete_confluence"
      file: "palomar/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "palomar/comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4.33.0 and Lake"
      tool_setup: >-
        Incremental and clean Lean compilation, source-closure inspection,
        kernel-reducing positive and negative checker regressions, and an
        independent review of the Challenge/Solution boundary.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local macOS workstation"
      prompting_notes: >-
        Developed a generic proof-carrying soundness theorem and a nontrivial
        funnel regression under Lean 4.33.0.
    - method: "manual"
      models: []
      framework: "Lean 4.33.0"
      tool_setup: "Human-authored scope, provenance, attribution, and metadata decisions"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    The checked Solution uses ordinary kernel reduction and does not use
    `native_decide`, `Lean.ofReduceBool`, a custom axiom, or a placeholder.
    `palomar/check.sh` compiles the Challenge, proof, and regression modules,
    prints their source dependencies, and checks the core-only Challenge
    closure.

fidelity:
  divergences: >-
    The selected Lean theorem uses an explicit finite certificate record and a
    symmetric strict predicate requiring every valley label to be smaller than
    both peak labels. It additionally requires Boolean/semantic reflection and
    a proof that the finite edge table is complete; these are the trust-boundary
    conditions needed to turn executable certificate acceptance into a theorem
    about the intended relation. The package does not formalize every theorem
    or external JSON artifact in the parent repository, and it makes no claim
    of novelty or priority for the decreasing-diagram criterion itself.

review:
  status: "self-assessed with clean-build, source-closure, and negative-regression checks"
  reviewers: []
  notes: >-
    Review covered the generic induction from checker acceptance to local
    decreasingness, the independent Boolean/Proposition boundary, the explicit
    completeness premise, the Lean 4.33.0 toolchain, and the three negative
    funnel regressions. Palomar mechanical verification, NanoDa replay,
    editorial review, and registration remain external states and are not
    claimed here.

alignment:
  namespace: "Metatheory.Palomar433"
  statements:
    - source: "Generic checked-certificate confluence theorem"
      lean: "Metatheory.Palomar433.checked_complete_confluence"
      module: "palomar/Challenge.lean / palomar/Solution.lean"
      status: "proved"
      note: >-
        Any Boolean-accepted finite certificate whose step table is complete
        for its semantic relation yields confluence of the unlabeled union.
    - source: "Self-contained certificate data"
      lean: "Metatheory.Palomar433.Certificate.Edge / PeakCertificate"
      module: "palomar/Challenge.lean / palomar/PalomarProof.lean"
      status: "defined"
      note: >-
        Edges, valley paths, and certificates are explicit data rather than
        proofs against a hidden external rewrite system.
    - source: "Executable checker"
      lean: "Metatheory.Palomar433.Certificate.checkB"
      module: "palomar/Challenge.lean / palomar/PalomarProof.lean"
      status: "defined and exercised"
      note: >-
        The checker tests edge soundness, finite peak coverage, decreasing
        paths, and canonical orientation; Checks.lean tests accepted and
        rejected certificates on a three-peak funnel.
    - source: "Semantic completeness bridge"
      lean: "Metatheory.Palomar433.Certificate.StepsComplete"
      module: "palomar/Challenge.lean / palomar/PalomarProof.lean"
      status: "hypothesis of the proved theorem"
      note: >-
        The explicit premise prevents a finite certificate from silently
        omitting a real semantic rewrite step.

acknowledgements: >-
  Thanks to the Lean and Lake communities, to the authors of the cited
  decreasing-diagrams work, and to the Palomar Registry template authors.
